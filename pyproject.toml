[project]
name = "cypherus-userbot"
version = "0.1.0"
description = "Telegram userbot foundation with web-based account linking"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.95,<0.100",
  "uvicorn[standard]>=0.24,<0.38",
  "telethon>=1.40.0",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.20",
  "pydantic>=1.10,<2.0"
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
