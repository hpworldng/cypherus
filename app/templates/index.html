<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cypherus Userbot Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="card">
      <header>
        <h1>Cypherus Userbot Dashboard</h1>
        <p class="muted">Create account with API ID/Hash, login, then link/manage devices.</p>
      </header>

      <section class="notice">
        <p><strong>Base URL:</strong> <code>{{PUBLIC_BASE_URL}}</code></p>
        <p><strong>Limit:</strong> Max 4 linked phones per API account.</p>
      </section>

      <form id="registerForm">
        <h3>Create Account</h3>
        <label>API ID <input name="api_id" type="number" required /></label>
        <label>API Hash <input name="api_hash" required /></label>
        <button type="submit">Create Account</button>
      </form>

      <form id="loginForm">
        <h3>Login</h3>
        <label>API ID <input name="api_id" type="number" required /></label>
        <label>API Hash <input name="api_hash" required /></label>
        <button type="submit">Login to Dashboard</button>
      </form>

      <section id="dashboard" class="hidden">
        <h3>Linked Devices</h3>
        <ul id="deviceList"></ul>

        <form id="linkStartForm">
          <label>Phone Number <input name="phone" placeholder="+15551234567" required /></label>
          <button type="submit">Send Login Code</button>
        </form>

        <form id="codeForm" class="hidden">
          <label>Login Code <input name="code" required /></label>
          <button type="submit">Verify Code</button>
        </form>

        <form id="passwordForm" class="hidden">
          <label>2FA Password <input name="password" type="password" required /></label>
          <button type="submit">Verify 2FA</button>
        </form>
      </section>

      <div id="loading" class="loading hidden">
        <div class="spinner" aria-hidden="true"></div>
        <span>Processing request...</span>
      </div>

      <pre id="log"></pre>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
