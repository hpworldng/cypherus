[project]
name = "cypherus-userbot"
version = "0.1.0"
description = "Telegram userbot foundation with web-based account linking"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0.0",
  "telethon>=1.40.0"
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
